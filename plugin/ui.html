<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Figma Agent Bridge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #1e1e1e;
      color: #e0e0e0;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }
    .header h2 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge.connected {
      background-color: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }
    .badge.disconnected {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .input-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"] {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 8px 10px;
      color: #fff;
      font-size: 12px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #18a0fb;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    button {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-primary {
      background-color: #18a0fb;
      color: #fff;
    }
    .btn-primary:hover {
      background-color: #0d8de3;
    }
    .btn-secondary {
      background-color: #333;
      color: #ccc;
    }
    .btn-secondary:hover {
      background-color: #444;
    }
    .log-container {
      background-color: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 10px;
      height: 230px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 11px;
      color: #aaa;
    }
    .log-item {
      margin-bottom: 6px;
      word-break: break-all;
      line-height: 1.4;
    }
    .log-item.in { color: #38bdf8; }
    .log-item.out { color: #4ade80; }
    .log-item.err { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Figma Agent Bridge</h2>
    <span id="statusBadge" class="badge disconnected">● Disconnected</span>
  </div>

  <div class="input-group">
    <label for="wsUrl">Agent WS Endpoint</label>
    <input type="text" id="wsUrl" value="ws://localhost:3050/ws" placeholder="ws://localhost:3050/ws" />
  </div>

  <div class="btn-row">
    <button id="btnConnect" class="btn-primary">Connect Agent</button>
    <button id="btnClear" class="btn-secondary">Clear Log</button>
  </div>

  <label>Activity Log</label>
  <div id="logBox" class="log-container">
    <div class="log-item">Plugin loaded. Ready to connect to Agent backend...</div>
  </div>

  <script>
    let ws = null;
    let pendingRequests = new Map();

    const statusBadge = document.getElementById('statusBadge');
    const wsUrlInput = document.getElementById('wsUrl');
    const btnConnect = document.getElementById('btnConnect');
    const btnClear = document.getElementById('btnClear');
    const logBox = document.getElementById('logBox');

    function log(msg, type = '') {
      const el = document.createElement('div');
      el.className = 'log-item ' + type;
      const time = new Date().toLocaleTimeString();
      el.textContent = `[${time}] ${msg}`;
      logBox.appendChild(el);
      logBox.scrollTop = logBox.scrollHeight;
    }

    btnClear.addEventListener('click', () => {
      logBox.innerHTML = '';
    });

    function connect() {
      const url = wsUrlInput.value.trim();
      if (!url) return;

      log(`Connecting to ${url}...`);
      if (ws) {
        ws.close();
      }

      try {
        ws = new WebSocket(url);
      } catch (e) {
        log(`Failed to create WebSocket: ${e.message}`, 'err');
        return;
      }

      ws.onopen = () => {
        statusBadge.textContent = '● Connected';
        statusBadge.className = 'badge connected';
        btnConnect.textContent = 'Disconnect';
        log('Connected to Figma Agent Bridge!', 'out');

        // Register plugin with agent
        ws.send(JSON.stringify({
          type: 'REGISTER_PLUGIN',
          timestamp: Date.now()
        }));
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          log(`[AGENT IN] ${data.type} ${data.action || ''}`, 'in');

          if (data.type === 'PING') {
            ws.send(JSON.stringify({ type: 'PONG', id: data.id }));
            return;
          }

          // Relay action request to code.ts (Figma main thread)
          parent.postMessage({ pluginMessage: data }, '*');
        } catch (err) {
          log(`Error parsing WS message: ${err.message}`, 'err');
        }
      };

      ws.onclose = () => {
        statusBadge.textContent = '● Disconnected';
        statusBadge.className = 'badge disconnected';
        btnConnect.textContent = 'Connect Agent';
        log('Disconnected from Agent.', 'err');
      };

      ws.onerror = (err) => {
        log('WebSocket connection error', 'err');
      };
    }

    btnConnect.addEventListener('click', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.close();
      } else {
        connect();
      }
    });

    // Listen for messages from code.ts (Figma main thread)
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      log(`[FIGMA OUT] ${msg.type} ${msg.action || ''}`, 'out');

      // Forward to WebSocket if connected
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg));
      }
    };

    // Auto connect on startup
    connect();
  </script>
</body>
</html>
